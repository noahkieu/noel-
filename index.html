<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Christmas - Pro Gesture</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        #canvas-container { width: 100%; height: 100vh; display: block; }
        
        #ui-layer {
            position: absolute; bottom: 30px; width: 100%;
            text-align: center; pointer-events: none; z-index: 100;
        }
        
        .guide { 
            color: rgba(255, 255, 255, 0.8); 
            font-size: 14px; 
            margin-bottom: 20px; 
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.3);
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
        }

        button {
            pointer-events: auto; cursor: pointer;
            background: linear-gradient(to bottom, #D32F2F, #8B0000); 
            color: #FFF; border: 2px solid #FFD700;
            padding: 15px 50px; border-radius: 30px; 
            font-weight: 800; font-size: 16px;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.6);
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        #camera-preview {
            position: absolute; top: 15px; right: 15px;
            width: 140px; height: 105px;
            border: 2px solid #FFD700; 
            transform: scaleX(-1); opacity: 0.8; border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        
        #copyright {
            position: absolute; bottom: 10px; right: 15px;
            color: rgba(255, 255, 255, 0.4); font-size: 12px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div id="ui-layer">
        <div class="guide">
            ✊ <b>Nắm tay:</b> Hiện cây thông &nbsp;|&nbsp; 🖐 <b>Xòe tay:</b> Pháo hoa &nbsp;|&nbsp; 👌 <b>Chụm ngón:</b> Xem ảnh
        </div><br>
        <button id="btnStart" onclick="startSystem()">BẮT ĐẦU PHÉP THUẬT</button>
    </div>

    <div id="copyright">© by vandiep</div>
    <div id="canvas-container"></div>
    <video class="input_video" style="display:none"></video>
    <canvas id="camera-preview"></canvas>

    <script>
        // 1. CONFIG & ASSETS
        const MUSIC_URL = "./audio.mp3";
        let bgMusic = new Audio(MUSIC_URL);
        bgMusic.loop = true;

        const loader = new THREE.TextureLoader();
        const photoFiles = ['./image1.jpeg', './image2.jpeg', './image3.jpeg', './image4.jpeg', './image5.jpeg'];
        const photoTextures = photoFiles.map(f => loader.load(f));

        function createCustomTexture(type) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const cx = 64, cy = 64;

            if (type === 'gold_glow') {
                const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 40);
                grd.addColorStop(0, '#FFFFFF'); grd.addColorStop(0.5, '#FFD700'); grd.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grd; ctx.fillRect(0,0,128,128);
            } else if (type === 'red_light') {
                const grd = ctx.createRadialGradient(cx, cy, 0, cx, cy, 50);
                grd.addColorStop(0, '#FFAAAA'); grd.addColorStop(0.3, '#FF0000'); grd.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grd; ctx.fillRect(0,0,128,128);
            } else if (type === 'gift_red') {
                ctx.fillStyle = '#D32F2F'; ctx.fillRect(20, 20, 88, 88);
                ctx.fillStyle = '#FFD700'; ctx.fillRect(54, 20, 20, 88); ctx.fillRect(20, 54, 88, 20);
            }
            return new THREE.CanvasTexture(canvas);
        }

        const textures = { gold: createCustomTexture('gold_glow'), red: createCustomTexture('red_light'), gift: createCustomTexture('gift_red') };

        const CONFIG = {
            goldCount: 2000, redCount: 300, giftCount: 150,
            explodeRadius: 65, photoOrbitRadius: 25,
            treeHeight: 70, treeBaseRadius: 35
        };

        let scene, camera, renderer, groupGold, groupRed, groupGift; 
        let photoMeshes = [], titleMesh, starMesh;
        let state = 'TREE', selectedIndex = 0, handX = 0.5;

        // 2. THREE.JS ENGINE
        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.002);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 100;

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            groupGold = createParticleSystem('gold', CONFIG.goldCount, 2.0);
            groupRed = createParticleSystem('red', CONFIG.redCount, 3.5); 
            groupGift = createParticleSystem('gift', CONFIG.giftCount, 3.0); 

            createPhotos();
            createDecorations();
            animate();
        }

        function createParticleSystem(type, count, size) {
            const pPositions = [], pExplodeTargets = [], pTreeTargets = [], sizes = [], phases = []; 
            
            for(let i=0; i<count; i++) {
                // Tree Target
                const h = Math.random() * CONFIG.treeHeight; 
                const y = h - CONFIG.treeHeight / 2;
                let rRatio = (type === 'gold') ? Math.sqrt(Math.random()) : 0.9 + Math.random()*0.1;
                const r = ((1 - (h / CONFIG.treeHeight)) * CONFIG.treeBaseRadius) * rRatio;
                const theta = Math.random() * Math.PI * 2;
                pTreeTargets.push(r * Math.cos(theta), y, r * Math.sin(theta));

                // Explode Target
                const phi = Math.acos(2 * Math.random() - 1);
                const lam = 2 * Math.PI * Math.random();
                const rad = CONFIG.explodeRadius * Math.cbrt(Math.random()) * (type === 'gift' ? 1.2 : 1.0);
                pExplodeTargets.push(rad * Math.sin(phi) * Math.cos(lam), rad * Math.sin(phi) * Math.sin(lam), rad * Math.cos(phi));

                pPositions.push(pTreeTargets[i*3], pTreeTargets[i*3+1], pTreeTargets[i*3+2]);
                sizes.push(size);
                phases.push(Math.random() * Math.PI * 2);
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.Float32BufferAttribute(pPositions, 3));
            geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
            
            const colors = new Float32Array(count * 3);
            const baseColor = new THREE.Color(type === 'gold' ? 0xFFD700 : (type === 'red' ? 0xFF0000 : 0xFFFFFF));
            for(let i=0; i<count; i++) { colors[i*3] = baseColor.r; colors[i*3+1] = baseColor.g; colors[i*3+2] = baseColor.b; }
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            geo.userData = { tree: pTreeTargets, explode: pExplodeTargets, phases, baseColor, baseSize: size };
            const mat = new THREE.PointsMaterial({
                size, map: textures[type], transparent: true, vertexColors: true,
                blending: type === 'gift' ? THREE.NormalBlending : THREE.AdditiveBlending,
                depthWrite: false, sizeAttenuation: true
            });

            const points = new THREE.Points(geo, mat);
            scene.add(points);
            return points;
        }

        function createPhotos() {
            const geo = new THREE.PlaneGeometry(8, 8);
            const borderMat = new THREE.MeshBasicMaterial({ color: 0xFFD700 }); 
            for(let i=0; i<5; i++) {
                const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ map: photoTextures[i], side: THREE.DoubleSide }));
                const border = new THREE.Mesh(new THREE.PlaneGeometry(8.5, 8.5), borderMat);
                border.position.z = -0.05; mesh.add(border);
                mesh.visible = false; scene.add(mesh);
                photoMeshes.push(mesh);
            }
        }

        function createDecorations() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.font = 'bold italic 90px serif'; ctx.fillStyle = '#FFD700'; ctx.textAlign = 'center';
            ctx.shadowColor = "#FF0000"; ctx.shadowBlur = 30; ctx.fillText("MERRY CHRISTMAS", 512, 130);
            titleMesh = new THREE.Mesh(new THREE.PlaneGeometry(60, 15), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true, blending: THREE.AdditiveBlending }));
            titleMesh.position.y = 50; scene.add(titleMesh);

            const starCanvas = document.createElement('canvas');
            starCanvas.width = 64; starCanvas.height = 64;
            const sCtx = starCanvas.getContext('2d');
            sCtx.fillStyle = "#FFFF00"; sCtx.beginPath();
            for(let i=0; i<5; i++){
                sCtx.lineTo(32 + Math.cos((18+i*72)*Math.PI/180)*30, 32 - Math.sin((18+i*72)*Math.PI/180)*30);
                sCtx.lineTo(32 + Math.cos((54+i*72)*Math.PI/180)*12, 32 - Math.sin((54+i*72)*Math.PI/180)*12);
            }
            sCtx.fill();
            starMesh = new THREE.Mesh(new THREE.PlaneGeometry(10, 10), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(starCanvas), transparent: true }));
            starMesh.position.y = CONFIG.treeHeight/2 + 2; scene.add(starMesh);
        }

        function updateParticles(group, type, targetState, speed, handRotY, time) {
            const pos = group.geometry.attributes.position.array;
            const colors = group.geometry.attributes.color.array;
            const { tree, explode, phases, baseColor, baseSize } = group.geometry.userData;
            const targets = (targetState === 'TREE') ? tree : explode;

            for(let i=0; i<pos.length; i++) pos[i] += (targets[i] - pos[i]) * speed;
            group.geometry.attributes.position.needsUpdate = true;

            if (targetState === 'TREE') {
                group.rotation.y += 0.005;
                for(let i=0; i<phases.length; i++) {
                    const b = 0.7 + 0.3 * Math.sin(time * (type==='red'?3:8) + phases[i]);
                    colors[i*3] = baseColor.r * b; colors[i*3+1] = baseColor.g * b; colors[i*3+2] = baseColor.b * b;
                }
            } else {
                group.rotation.y += (handRotY - group.rotation.y) * 0.1;
                for(let i=0; i<phases.length; i++) {
                    const b = 0.8 + 0.4 * Math.sin(time * 10 + phases[i]);
                    colors[i*3] = baseColor.r * b; colors[i*3+1] = baseColor.g * b; colors[i*3+2] = baseColor.b * b;
                }
            }
            group.geometry.attributes.color.needsUpdate = true;
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            const handRotY = (handX - 0.5) * 4.0;

            updateParticles(groupGold, 'gold', state, 0.08, handRotY, time);
            updateParticles(groupRed, 'red', state, 0.08, handRotY, time);
            updateParticles(groupGift, 'gift', state, 0.08, handRotY, time);

            if (state === 'TREE') {
                titleMesh.visible = starMesh.visible = true;
                starMesh.rotation.z -= 0.03;
                photoMeshes.forEach(m => { m.visible = false; m.scale.set(0,0,0); });
            } else if (state === 'EXPLODE') {
                titleMesh.visible = starMesh.visible = false;
                const step = (Math.PI * 2) / 5;
                photoMeshes.forEach((m, i) => {
                    m.visible = true;
                    const angle = groupGold.rotation.y + i * step;
                    const targetPos = new THREE.Vector3(Math.sin(angle)*25, Math.sin(time+i)*3, Math.cos(angle)*25);
                    m.position.lerp(targetPos, 0.1);
                    m.lookAt(camera.position);
                    const s = 1.0 + (m.position.z/25)*0.8;
                    m.scale.lerp(new THREE.Vector3(s,s,s), 0.1);
                    if(m.position.z > 15) selectedIndex = i;
                });
            } else if (state === 'PHOTO') {
                photoMeshes.forEach((m, i) => {
                    if(i === selectedIndex) {
                        m.visible = true; m.position.lerp(new THREE.Vector3(0, 0, 60), 0.1);
                        m.scale.lerp(new THREE.Vector3(5, 5, 5), 0.1); m.rotation.set(0,0,0);
                    } else { m.visible = false
