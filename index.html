<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Christmas - Enhanced Tree</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; touch-action: none; }
        #canvas-container { width: 100%; height: 100vh; display: block; }
        #ui-layer { position: absolute; bottom: 8%; width: 100%; text-align: center; z-index: 100; pointer-events: none; }
        .guide { color: white; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 20px; display: inline-block; font-size: 14px; border: 1px solid gold; }
        button { pointer-events: auto; cursor: pointer; background: #D32F2F; color: white; border: 2px solid #FFD700; padding: 15px 40px; border-radius: 30px; font-weight: bold; font-size: 18px; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
        #camera-preview { position: absolute; top: 10px; left: 10px; width: 110px; height: 82px; border: 1px solid #FFD700; transform: scaleX(-1); border-radius: 8px; z-index: 50; opacity: 0.8; }
        #status-info { position: absolute; top: 100px; left: 10px; color: gold; font-size: 13px; z-index: 50; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px; border-left: 3px solid #D32F2F; }
    </style>
</head>
<body>
    <div id="status-info">Chờ nhấn nút...</div>
    <div id="ui-layer">
        <div class="guide">🖐 <b>Xòe tay:</b> Xem vòng xoay ảnh &nbsp;|&nbsp; ✊ <b>Nắm tay:</b> Về cây thông</div><br><br>
        <button id="btnStart">BẮT ĐẦU PHÉP THUẬT</button>
    </div>

    <div id="canvas-container"></div>
    <video class="input_video" style="display:none" playsinline></video>
    <canvas id="camera-preview"></canvas>

    <script>
        let scene, camera, renderer, groupGold, photoMeshes = [], starMesh, treeBase, ornaments = [];
        let state = 'TREE', handX = 0.5, selectedIndex = 0;
        let currentRotation = 0;
        const bgMusic = new Audio("./audio.mp3");
        bgMusic.loop = true;

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 110;

            renderer = new THREE.WebGLRenderer({ antialias: true }); // Bật antialias để mịn hơn
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Thêm hiệu ứng ánh sáng
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);
            
            const directionalLight = new THREE.DirectionalLight(0xffeedd, 0.8);
            directionalLight.position.set(0, 1, 1);
            scene.add(directionalLight);

            // Tạo hệ thống hạt với nhiều màu sắc
            const count = 2500; // Tăng số lượng hạt
            const treeTargets = new Float32Array(count * 3);
            const explodeTargets = new Float32Array(count * 3);
            const pos = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3); // Mảng màu cho từng hạt

            // Bảng màu đa dạng cho Giáng sinh
            const colorPalette = [
                [0.1, 0.8, 0.1], // Xanh lá tươi
                [0.0, 0.6, 0.0], // Xanh lá đậm
                [0.9, 0.2, 0.2], // Đỏ
                [0.9, 0.9, 0.0], // Vàng
                [0.0, 0.7, 0.9], // Xanh dương
                [1.0, 0.5, 0.0], // Cam
                [0.8, 0.0, 0.8], // Tím
                [1.0, 1.0, 1.0]  // Trắng
            ];

            for(let i=0; i<count; i++) {
                // Tạo hình cây thông mềm mại hơn
                const h = Math.random() * 70;
                const normalizedHeight = h / 70;
                
                // Tạo hình nón mềm mại, không gai
                const smoothFactor = Math.pow(Math.random(), 2); // Làm mịn phân bố
                const r = (1 - normalizedHeight) * 35 * smoothFactor;
                const theta = Math.random() * Math.PI * 2;
                
                treeTargets[i*3] = r * Math.cos(theta);
                treeTargets[i*3+1] = h - 35;
                treeTargets[i*3+2] = r * Math.sin(theta);

                // Tạo mục tiêu khi nổ
                const rad = 60 * Math.cbrt(Math.random());
                const phi = Math.acos(2 * Math.random() - 1);
                const lam = 2 * Math.PI * Math.random();
                explodeTargets[i*3] = rad * Math.sin(phi) * Math.cos(lam);
                explodeTargets[i*3+1] = rad * Math.sin(phi) * Math.sin(lam);
                explodeTargets[i*3+2] = rad * Math.cos(phi);

                pos[i*3] = treeTargets[i*3]; 
                pos[i*3+1] = treeTargets[i*3+1]; 
                pos[i*3+2] = treeTargets[i*3+2];

                // Gán màu ngẫu nhiên từ bảng màu
                const color = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                const heightFactor = normalizedHeight;
                
                // Thay đổi màu sắc theo độ cao
                colors[i*3] = color[0] * (0.7 + 0.3 * heightFactor);
                colors[i*3+1] = color[1] * (0.7 + 0.3 * heightFactor);
                colors[i*3+2] = color[2] * (0.7 + 0.3 * heightFactor);
            }

            // Tạo thân cây (tree base)
            const baseGeometry = new THREE.CylinderGeometry(5, 7, 15, 8);
            const baseMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x8B4513, // Nâu sô cô la
                shininess: 30
            });
            treeBase = new THREE.Mesh(baseGeometry, baseMaterial);
            treeBase.position.y = -42;
            scene.add(treeBase);

            // Tạo geometry với màu sắc
            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            
            // Sử dụng PointsMaterial với vertexColors để có nhiều màu
            groupGold = new THREE.Points(geo, new THREE.PointsMaterial({ 
                size: 1.5, 
                vertexColors: true,
                transparent: true,
                opacity: 0.9,
                sizeAttenuation: true
            }));
            groupGold.userData = { tree: treeTargets, explode: explodeTargets };
            scene.add(groupGold);

            // Tạo ngôi sao trên đỉnh cây
            const starGeometry = new THREE.SphereGeometry(3, 4, 2);
            const starMaterial = new THREE.MeshPhongMaterial({ 
                color: 0xFFD700,
                emissive: 0xFFAA00,
                emissiveIntensity: 0.5,
                shininess: 100
            });
            starMesh = new THREE.Mesh(starGeometry, starMaterial);
            starMesh.position.y = 38;
            starMesh.scale.set(1, 2, 1); // Kéo dài để tạo hình sao
            scene.add(starMesh);

            // Thêm một số đồ trang trí (ornaments) lớn
            const ornamentGeometry = new THREE.SphereGeometry(2, 16, 16);
            const ornamentColors = [0xFF0000, 0x00FF00, 0x0000FF, 0xFFD700, 0xFF00FF];
            
            for(let i = 0; i < 15; i++) {
                const ornamentMaterial = new THREE.MeshPhongMaterial({
                    color: ornamentColors[i % ornamentColors.length],
                    shininess: 100,
                    emissive: 0x222222
                });
                const ornament = new THREE.Mesh(ornamentGeometry, ornamentMaterial);
                
                // Đặt vị trí ngẫu nhiên trên cây
                const angle = Math.random() * Math.PI * 2;
                const radius = (1 - Math.random() * 0.5) * 25;
                const height = Math.random() * 60 - 30;
                
                ornament.position.set(
                    Math.cos(angle) * radius,
                    height,
                    Math.sin(angle) * radius
                );
                
                ornament.userData = { 
                    originalY: height,
                    speed: 0.02 + Math.random() * 0.03,
                    angle: Math.random() * Math.PI * 2
                };
                
                scene.add(ornament);
                ornaments.push(ornament);
            }

            // Tải ảnh
            const loader = new THREE.TextureLoader();
            for(let i=1; i<=5; i++) {
                const tex = loader.load(`./image${i}.jpeg`);
                const mesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(13, 13), 
                    new THREE.MeshBasicMaterial({ 
                        map: tex, 
                        side: THREE.DoubleSide,
                        transparent: true
                    })
                );
                mesh.visible = false;
                scene.add(mesh);
                photoMeshes.push(mesh);
            }
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            
            // Cập nhật vị trí các hạt
            const positions = groupGold.geometry.attributes.position.array;
            const targets = (state === 'TREE') ? groupGold.userData.tree : groupGold.userData.explode;

            for(let i=0; i<positions.length; i++) {
                positions[i] += (targets[i] - positions[i]) * 0.1;
            }
            groupGold.geometry.attributes.position.needsUpdate = true;

            // Cập nhật góc xoay
            let speed = (state === 'EXPLODE') ? (handX - 0.5) * 0.2 : 0.01;
            if (state === 'EXPLODE' && Math.abs(speed) < 0.02) speed = 0.02;
            
            currentRotation += speed;

            if (state === 'TREE') {
                groupGold.rotation.y += 0.015;
                treeBase.rotation.y += 0.015;
                starMesh.rotation.y += 0.02;
                
                // Hiệu ứng lấp lánh cho ngôi sao
                starMesh.scale.y = 2 + Math.sin(time * 3) * 0.3;
                starMesh.position.y = 38 + Math.sin(time * 2) * 1;
                
                // Hiệu ứng cho các đồ trang trí
                ornaments.forEach(ornament => {
                    ornament.rotation.y += 0.02;
                    ornament.position.y = ornament.userData.originalY + Math.sin(time * ornament.userData.speed + ornament.userData.angle) * 2;
                });
                
                photoMeshes.forEach(m => { 
                    m.visible = false; 
                    m.scale.set(0,0,0); 
                });
            } else if (state === 'EXPLODE') {
                groupGold.rotation.y = currentRotation;
                treeBase.visible = false;
                starMesh.visible = false;
                ornaments.forEach(o => o.visible = false);
                
                photoMeshes.forEach((m, i) => {
                    m.visible = true;
                    const angle = currentRotation + i * (Math.PI * 2 / 5);
                    const radius = 38;
                    m.position.set(
                        Math.sin(angle) * radius, 
                        Math.sin(time + i) * 3, 
                        Math.cos(angle) * radius
                    );
                    m.lookAt(0, 0, 0); 
                    m.scale.lerp(new THREE.Vector3(1.5, 1.5, 1.5), 0.1);
                    
                    // Xác định ảnh nào đang ở phía trước
                    if(m.position.z > 25) selectedIndex = i;
                });
            } else if (state === 'PHOTO') {
                treeBase.visible = false;
                starMesh.visible = false;
                ornaments.forEach(o => o.visible = false);
                
                photoMeshes.forEach((m, i) => {
                    if(i === selectedIndex) {
                        m.visible = true; 
                        m.position.lerp(new THREE.Vector3(0,0,65), 0.15);
                        m.scale.lerp(new THREE.Vector3(5,5,5), 0.15); 
                        m.lookAt(camera.position);
                    } else {
                        m.visible = false;
                    }
                });
            }
            
            renderer.render(scene, camera);
        }

        async function runMagic() {
            document.getElementById('btnStart').style.display = 'none';
            bgMusic.play().catch(() => {});
            init3D();

            const video = document.querySelector('.input_video');
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

            hands.onResults(results => {
                const cv = document.getElementById('camera-preview');
                const ctx = cv.getContext('2d');
                ctx.clearRect(0,0,cv.width,cv.height);
                if(results.image) ctx.drawImage(results.image, 0, 0, cv.width, cv.height);

                const statusEl = document.getElementById('status-info');

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    handX = lm[9].x; 

                    const isFingerOpen = (tip, pip) => lm[tip].y < lm[pip].y;
                    const openCount = [isFingerOpen(8,6), isFingerOpen(12,10), isFingerOpen(16,14), isFingerOpen(20,18)].filter(Boolean).length;
                    const pinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);

                    if (pinch < 0.06) {
                        state = 'PHOTO'; 
                        statusEl.innerText = "Trạng thái: 👌 Phóng to";
                    } else if (openCount <= 1) {
                        state = 'TREE'; 
                        statusEl.innerText = "Trạng thái: ✊ Cây thông";
                        treeBase.visible = true;
                        starMesh.visible = true;
                        ornaments.forEach(o => o.visible = true);
                    } else {
                        state = 'EXPLODE'; 
                        statusEl.innerText = "Trạng thái: 🖐 Xoay ảnh (Di chuyển tay trái/phải)";
                    }
                } else {
                    if(state !== 'PHOTO') state = 'TREE'; 
                    statusEl.innerText = "Trạng thái: Không thấy tay";
                }
            });

            const cam = new Camera(video, {
                onFrame: async () => { await hands.send({image: video}); },
                width: 480, height: 360
            });
            cam.start();
        }

        document.getElementById('btnStart').addEventListener('click', runMagic);
        window.addEventListener('resize', () => {
            if(camera && renderer) {
                camera.aspect = window.innerWidth/window.innerHeight; 
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
