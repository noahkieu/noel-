<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Christmas - Rainbow Tree</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; touch-action: none; }
        #canvas-container { width: 100%; height: 100vh; display: block; }
        #ui-layer { position: absolute; bottom: 8%; width: 100%; text-align: center; z-index: 100; pointer-events: none; }
        .guide { color: white; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 20px; display: inline-block; font-size: 14px; border: 1px solid gold; }
        button { pointer-events: auto; cursor: pointer; background: #D32F2F; color: white; border: 2px solid #FFD700; padding: 15px 40px; border-radius: 30px; font-weight: bold; font-size: 18px; box-shadow: 0 0 20px rgba(255,0,0,0.5); }
        #camera-preview { position: absolute; top: 10px; left: 10px; width: 110px; height: 82px; border: 1px solid #FFD700; transform: scaleX(-1); border-radius: 8px; z-index: 50; opacity: 0.8; }
        #status-info { position: absolute; top: 100px; left: 10px; color: gold; font-size: 13px; z-index: 50; background: rgba(0,0,0,0.6); padding: 5px 10px; border-radius: 5px; border-left: 3px solid #D32F2F; }
    </style>
</head>
<body>
    <div id="status-info">Chờ nhấn nút...</div>
    <div id="ui-layer">
        <div class="guide">🖐 <b>Xòe tay:</b> Xoay ảnh | ✊ <b>Nắm tay:</b> Cây thông đa sắc</div><br><br>
        <button id="btnStart">BẮT ĐẦU PHÉP THUẬT</button>
    </div>

    <div id="canvas-container"></div>
    <video class="input_video" style="display:none" playsinline></video>
    <canvas id="camera-preview"></canvas>

    <script>
        let scene, camera, renderer, particleSystem, photoMeshes = [];
        let state = 'TREE', handX = 0.5, selectedIndex = 0;
        let currentRotation = 0; 
        const bgMusic = new Audio("./audio.mp3");
        bgMusic.loop = true;

        // Tạo hạt sáng tỏa tròn
        function createPointTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grd = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grd.addColorStop(0, 'white');
            grd.addColorStop(0.4, 'rgba(255,255,255,0.5)');
            grd.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grd; ctx.fillRect(0,0,64,64);
            return new THREE.CanvasTexture(canvas);
        }

        function init3D() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 110;

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.2)); 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const count = 2500;
            const treeTargets = new Float32Array(count * 3);
            const explodeTargets = new Float32Array(count * 3);
            const pos = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const colorObj = new THREE.Color();

            for(let i=0; i<count; i++) {
                // Tọa độ cây thông
                const h = Math.random() * 75;
                const r = (1 - h/75) * 38 * Math.sqrt(Math.random());
                const theta = Math.random() * Math.PI * 2;
                treeTargets[i*3] = r * Math.cos(theta);
                treeTargets[i*3+1] = h - 35;
                treeTargets[i*3+2] = r * Math.sin(theta);

                // Tọa độ pháo hoa nổ
                const rad = 65 * Math.cbrt(Math.random());
                const phi = Math.acos(2 * Math.random() - 1);
                const lam = 2 * Math.PI * Math.random();
                explodeTargets[i*3] = rad * Math.sin(phi) * Math.cos(lam);
                explodeTargets[i*3+1] = rad * Math.sin(phi) * Math.sin(lam);
                explodeTargets[i*3+2] = rad * Math.cos(phi);

                pos[i*3] = treeTargets[i*3]; pos[i*3+1] = treeTargets[i*3+1]; pos[i*3+2] = treeTargets[i*3+2];

                // Gán màu sắc ngẫu nhiên cực rực rỡ
                const rand = Math.random();
                if (rand < 0.25) colorObj.setHex(0xFF0000); // Đỏ
                else if (rand < 0.50) colorObj.setHex(0x00FF00); // Xanh lá
                else if (rand < 0.75) colorObj.setHex(0xFFD700); // Vàng
                else colorObj.setHex(0x00FFFF); // Xanh dương sáng

                colors[i*3] = colorObj.r;
                colors[i*3+1] = colorObj.g;
                colors[i*3+2] = colorObj.b;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const mat = new THREE.PointsMaterial({
                size: 1.8,
                map: createPointTexture(),
                vertexColors: true, // Cho phép dùng màu từ mảng colors
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particleSystem = new THREE.Points(geo, mat);
            particleSystem.userData = { tree: treeTargets, explode: explodeTargets, originalColors: colors };
            scene.add(particleSystem);

            const loader = new THREE.TextureLoader();
            for(let i=1; i<=5; i++) {
                const tex = loader.load(`./image${i}.jpeg`);
                const mesh = new THREE.Mesh(new THREE.PlaneGeometry(13, 13), new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide }));
                mesh.visible = false;
                scene.add(mesh);
                photoMeshes.push(mesh);
            }
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            const positions = particleSystem.geometry.attributes.position.array;
            const targets = (state === 'TREE') ? particleSystem.userData.tree : particleSystem.userData.explode;

            for(let i=0; i<positions.length; i++) positions[i] += (targets[i] - positions[i]) * 0.1;
            particleSystem.geometry.attributes.position.needsUpdate = true;

            // HIỆU ỨNG NHẤP NHÁY MÀU SẮC
            const colorArr = particleSystem.geometry.attributes.color.array;
            const origColors = particleSystem.userData.originalColors;
            for(let i=0; i<colorArr.length/3; i++) {
                // Mỗi hạt sẽ có nhịp nháy khác nhau
                const twinkle = 0.5 + 0.5 * Math.sin(time * 3 + i);
                colorArr[i*3] = origColors[i*3] * twinkle;
                colorArr[i*3+1] = origColors[i*3+1] * twinkle;
                colorArr[i*3+2] = origColors[i*3+2] * twinkle;
            }
            particleSystem.geometry.attributes.color.needsUpdate = true;

            let speed = (state === 'EXPLODE') ? (handX - 0.5) * 0.2 : 0.01;
            if (state === 'EXPLODE' && Math.abs(speed) < 0.02) speed = 0.02;
            currentRotation += speed;

            if (state === 'TREE') {
                particleSystem.rotation.y += 0.015;
                photoMeshes.forEach(m => { m.visible = false; m.scale.set(0,0,0); });
            } else if (state === 'EXPLODE') {
                particleSystem.rotation.y = currentRotation;
                photoMeshes.forEach((m, i) => {
                    m.visible = true;
                    const angle = currentRotation + i * (Math.PI * 2 / 5);
                    const radius = 38;
                    m.position.set(Math.sin(angle) * radius, Math.sin(time + i) * 3, Math.cos(angle) * radius);
                    m.lookAt(0, 0, 0); 
                    m.scale.lerp(new THREE.Vector3(1.5, 1.5, 1.5), 0.1);
                    if(m.position.z > 25) selectedIndex = i;
                });
            } else if (state === 'PHOTO') {
                photoMeshes.forEach((m, i) => {
                    if(i === selectedIndex) {
                        m.visible = true; m.position.lerp(new THREE.Vector3(0,0,65), 0.15);
                        m.scale.lerp(new THREE.Vector3(5,5,5), 0.15); m.lookAt(camera.position);
                    } else m.visible = false;
                });
            }
            renderer.render(scene, camera);
        }

        async function runMagic() {
            document.getElementById('btnStart').style.display = 'none';
            bgMusic.play().catch(() => {});
            init3D();

            const video = document.querySelector('.input_video');
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });

            hands.onResults(results => {
                const cv = document.getElementById('camera-preview');
                const ctx = cv.getContext('2d');
                ctx.clearRect(0,0,cv.width,cv.height);
                if(results.image) ctx.drawImage(results.image, 0, 0, cv.width, cv.height);

                const statusEl = document.getElementById('status-info');

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    handX = lm[9].x; 
                    const isFingerOpen = (tip, pip) => lm[tip].y < lm[pip].y;
                    const openCount = [isFingerOpen(8,6), isFingerOpen(12,10), isFingerOpen(16,14), isFingerOpen(20,18)].filter(Boolean).length;
                    const pinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);

                    if (pinch < 0.06) {
                        state = 'PHOTO'; statusEl.innerText = "Trạng thái: 👌 Phóng to";
                    } else if (openCount <= 1) {
                        state = 'TREE'; statusEl.innerText = "Trạng thái: ✊ Cây thông rực rỡ";
                    } else {
                        state = 'EXPLODE'; statusEl.innerText = "Trạng thái: 🖐 Xoay ảnh";
                    }
                } else {
                    if(state !== 'PHOTO') state = 'TREE'; 
                    statusEl.innerText = "Trạng thái: Không thấy tay";
                }
            });

            const cam = new Camera(video, {
                onFrame: async () => { await hands.send({image: video}); },
                width: 480, height: 360
            });
            cam.start();
        }

        document.getElementById('btnStart').addEventListener('click', runMagic);
        window.addEventListener('resize', () => {
            if(camera && renderer) {
                camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        });
    </script>
</body>
</html>
