<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Magic Christmas - Final Animation Fix</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; touch-action: none; }
        #canvas-container { width: 100%; height: 100vh; display: block; }
        #ui-layer { position: absolute; bottom: 8%; width: 100%; text-align: center; z-index: 100; pointer-events: none; }
        .guide { color: white; background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 20px; display: inline-block; font-size: 14px; border: 1px solid gold; box-shadow: 0 0 10px rgba(255,215,0,0.2); }
        button { pointer-events: auto; cursor: pointer; background: linear-gradient(#D32F2F, #8B0000); color: white; border: 2px solid #FFD700; padding: 15px 40px; border-radius: 30px; font-weight: bold; font-size: 18px; box-shadow: 0 0 20px rgba(255,0,0,0.5); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        #camera-preview { position: absolute; top: 10px; left: 10px; width: 110px; height: 82px; border: 1px solid #FFD700; transform: scaleX(-1); border-radius: 8px; z-index: 50; opacity: 0.8; }
        #status-info { position: absolute; top: 100px; left: 10px; color: gold; font-size: 12px; z-index: 50; background: rgba(0,0,0,0.5); padding: 4px 8px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="status-info">Đang chờ camera...</div>
    <div id="ui-layer">
        <div class="guide">🖐 <b>Xòe tay:</b> Vòng quay ảnh | ✊ <b>Nắm tay:</b> Cây thông | 👌 <b>Chụm:</b> Phóng to</div><br><br>
        <button id="btnStart">BẮT ĐẦU PHÉP THUẬT</button>
    </div>

    <div id="canvas-container"></div>
    <video class="input_video" style="display:none" playsinline></video>
    <canvas id="camera-preview"></canvas>

    <script>
        let scene, camera, renderer, groupGold, photoMeshes = [];
        let state = 'TREE', handX = 0.5, selectedIndex = 0;
        let autoRotation = 0; // Biến tích lũy góc xoay
        const bgMusic = new Audio("./audio.mp3");
        bgMusic.loop = true;

        // Tạo texture hạt lấp lánh
        function createPointTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            const grd = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
            grd.addColorStop(0, 'rgba(255,255,255,1)');
            grd.addColorStop(0.3, 'rgba(255,215,0,0.8)');
            grd.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = grd; ctx.fillRect(0,0,64,64);
            return new THREE.CanvasTexture(canvas);
        }

        function init3D() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.0015);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 1000);
            camera.position.z = 110;

            renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5)); 
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            const count = 2000;
            const treeTargets = new Float32Array(count * 3);
            const explodeTargets = new Float32Array(count * 3);
            const pos = new Float32Array(count * 3);
            const sizes = new Float32Array(count);

            for(let i=0; i<count; i++) {
                // Cây thông
                const h = Math.random() * 75;
                const r = (1 - h/75) * 38 * Math.sqrt(Math.random());
                const theta = Math.random() * Math.PI * 2;
                treeTargets[i*3] = r * Math.cos(theta);
                treeTargets[i*3+1] = h - 35;
                treeTargets[i*3+2] = r * Math.sin(theta);

                // Vòng quay (Explode)
                const rad = 65 * Math.cbrt(Math.random());
                const phi = Math.acos(2 * Math.random() - 1);
                const lam = 2 * Math.PI * Math.random();
                explodeTargets[i*3] = rad * Math.sin(phi) * Math.cos(lam);
                explodeTargets[i*3+1] = rad * Math.sin(phi) * Math.sin(lam);
                explodeTargets[i*3+2] = rad * Math.cos(phi);

                pos[i*3] = treeTargets[i*3]; pos[i*3+1] = treeTargets[i*3+1]; pos[i*3+2] = treeTargets[i*3+2];
                sizes[i] = Math.random() * 2 + 1;
            }

            const geo = new THREE.BufferGeometry();
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            geo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            
            groupGold = new THREE.Points(geo, new THREE.PointsMaterial({ 
                size: 1.5, 
                map: createPointTexture(), 
                transparent: true, 
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                color: 0xFFD700 
            }));
            groupGold.userData = { tree: treeTargets, explode: explodeTargets };
            scene.add(groupGold);

            const loader = new THREE.TextureLoader();
            for(let i=1; i<=5; i++) {
                const tex = loader.load(`./image${i}.jpeg`);
                const group = new THREE.Group(); // Dùng group để xoay ảnh dễ hơn
                const mesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(14, 14), 
                    new THREE.MeshBasicMaterial({ map: tex, side: THREE.DoubleSide, transparent: true })
                );
                // Thêm viền vàng cho ảnh
                const border = new THREE.Mesh(
                    new THREE.PlaneGeometry(14.5, 14.5),
                    new THREE.MeshBasicMaterial({ color: 0xFFD700, side: THREE.DoubleSide })
                );
                border.position.z = -0.1;
                group.add(border);
                group.add(mesh);
                group.visible = false;
                scene.add(group);
                photoMeshes.push(group);
            }
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            const time = Date.now() * 0.001;
            const positions = groupGold.geometry.attributes.position.array;
            const targets = (state === 'TREE') ? groupGold.userData.tree : groupGold.userData.explode;

            // Di chuyển hạt mượt mà
            for(let i=0; i<positions.length; i++) {
                positions[i] += (targets[i] - positions[i]) * 0.1;
            }
            groupGold.geometry.attributes.position.needsUpdate = true;

            // Logic xoay ảnh tự động + bám theo tay
            // Nếu xòe tay, tốc độ xoay sẽ ảnh hưởng bởi handX
            let rotationSpeed = 0.005; // Tốc độ mặc định
            if (state === 'EXPLODE') {
                rotationSpeed = (handX - 0.5) * 0.15; // Tay càng xa tâm xoay càng nhanh
            }
            autoRotation += rotationSpeed;

            if (state === 'TREE') {
                groupGold.rotation.y += 0.01;
                photoMeshes.forEach(m => { 
                    m.visible = false; 
                    m.scale.lerp(new THREE.Vector3(0,0,0), 0.1); 
                });
            } else if (state === 'EXPLODE') {
                groupGold.rotation.y = autoRotation; // Hạt xoay theo
                photoMeshes.forEach((m, i) => {
                    m.visible = true;
                    const angle = autoRotation + i * (Math.PI * 2 / 5);
                    const radius = 40;
                    
                    // Hiệu ứng animation bồng bềnh (bobbing)
                    const yPos = Math.sin(time + i) * 4;
                    
                    m.position.set(Math.sin(angle) * radius, yPos, Math.cos(angle) * radius);
                    m.lookAt(0, 0, 0); // Luôn nhìn vào tâm vòng xoay
                    
                    // Zoom nhẹ ảnh ở gần camera
                    const scaleVal = (m.position.z > 20) ? 1.8 : 1.2;
                    m.scale.lerp(new THREE.Vector3(scaleVal, scaleVal, scaleVal), 0.1);
                    
                    if(m.position.z > 30) selectedIndex = i;
                });
            } else if (state === 'PHOTO') {
                photoMeshes.forEach((m, i) => {
                    if(i === selectedIndex) {
                        m.visible = true;
                        m.position.lerp(new THREE.Vector3(0, 0, 65), 0.1);
                        m.scale.lerp(new THREE.Vector3(5, 5, 5), 0.1);
                        m.rotation.y = Math.sin(time) * 0.2; // Lắc lư nhẹ khi phóng to
                    } else {
                        m.scale.lerp(new THREE.Vector3(0,0,0), 0.1);
                        setTimeout(() => { if(state === 'PHOTO' && i !== selectedIndex) m.visible = false; }, 200);
                    }
                });
            }
            renderer.render(scene, camera);
        }

        async function runMagic() {
            document.getElementById('btnStart').style.display = 'none';
            bgMusic.play().catch(() => {});
            init3D();

            const video = document.querySelector('.input_video');
            const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
            
            hands.setOptions({ maxNumHands: 1, modelComplexity: 0, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });

            hands.onResults(results => {
                const cv = document.getElementById('camera-preview');
                const ctx = cv.getContext('2d');
                ctx.clearRect(0,0,cv.width,cv.height);
                if(results.image) ctx.drawImage(results.image, 0, 0, cv.width, cv.height);

                const statusEl = document.getElementById('status-info');

                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    const lm = results.multiHandLandmarks[0];
                    // handX mượt hơn
                    handX = handX * 0.8 + lm[9].x * 0.2; 

                    const isFingerOpen = (tip, pip) => lm[tip].y < lm[pip].y;
                    const openCount = [isFingerOpen(8,6), isFingerOpen(12,10), isFingerOpen(16,14), isFingerOpen(20,18)].filter(Boolean).length;
                    const pinch = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);

                    if (pinch < 0.05) {
                        state = 'PHOTO'; statusEl.innerText = "Trạng thái: 👌 Xem ảnh";
                    } else if (openCount <= 1) {
                        state = 'TREE'; statusEl.innerText = "Trạng thái: ✊ Cây thông";
                    } else {
                        state = 'EXPLODE'; statusEl.innerText = "Trạng thái: 🖐 Vòng xoay ảnh";
                    }
                } else {
                    state = 'TREE'; statusEl.innerText = "Trạng thái: Đang tìm tay...";
                }
            });

            const cam = new Camera(video, {
                onFrame: async () => { await hands.send({image: video}); },
                width: 480, height: 360
            });
            cam.start();
        }

        document.getElementById('btnStart').addEventListener('click', runMagic);
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth/window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
